general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  # On both NVIDIA and the laptop's Intel/NVIDIA path the DRM outputs can be
  # resumed after hypridle receives the wake notification.  Give DRM a moment,
  # then recreate the output state.  On the HDR Dell the helper also re-sends
  # HDR metadata, which NVIDIA otherwise loses across suspend.
  after_sleep_cmd = /home/patrick/.config/hypr/restore-display-after-resume
}

# Turn displays off after five minutes; any input turns them back on.
listener {
  timeout = 300
  on-timeout = /run/current-system/sw/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
  on-resume = /run/current-system/sw/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after fifteen minutes. The general hook locks first.
listener {
  timeout = 900
  on-timeout = systemctl suspend
}
