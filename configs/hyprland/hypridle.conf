general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  # On both NVIDIA and the laptop's Intel/NVIDIA path the DRM outputs can be
  # resumed after hypridle receives the wake notification.  Sending DPMS on
  # immediately races that initialization and leaves the graphical VT black,
  # even though the system itself has resumed.  Give DRM a moment, then
  # explicitly recreate the outputs.
  after_sleep_cmd = sh -c 'sleep 2; hyprctl dispatch dpms on'
}

# Turn displays off after five minutes; any input turns them back on.
listener {
  timeout = 300
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# Suspend after fifteen minutes. The general hook locks first.
listener {
  timeout = 900
  on-timeout = systemctl suspend
}
