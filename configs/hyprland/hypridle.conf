general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  # On both NVIDIA and the laptop's Intel/NVIDIA path the DRM outputs can be
  # resumed after hypridle receives the wake notification.  Sending DPMS on
  # immediately races that initialization and leaves the graphical VT black,
  # even though the system itself has resumed.  Give DRM a moment, then
  # explicitly recreate the outputs.  Hyprland 0.55 uses its Lua dispatcher
  # syntax; legacy `dpms on` is parsed as invalid Lua.
  after_sleep_cmd = /run/current-system/sw/bin/sleep 2 && /run/current-system/sw/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Turn displays off after five minutes; any input turns them back on.
listener {
  timeout = 300
  on-timeout = /run/current-system/sw/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
  on-resume = /run/current-system/sw/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after fifteen minutes. The general hook locks first.
listener {
  timeout = 900
  on-timeout = systemctl suspend
}
