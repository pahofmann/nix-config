# Shortcut catalogue for DMS' "Hyprland Keybinds" pop-up.
#
# Hyprland 0.55 uses the Lua configuration in hyprland.lua at runtime.  DMS
# currently reads only this legacy file for its catalogue, so these entries
# deliberately mirror the active bindings without becoming a second source of
# truth for their behaviour.  Keep the command/action in sync with the Lua
# binding and use bindd so DMS receives the human-readable description.

# DMS and session
bindrd = , Super_L, Open application launcher, exec, dms ipc call spotlight toggle
bindrd = , Super_R, Open application launcher, exec, dms ipc call spotlight toggle
bindd = SUPER, SPACE, Open application launcher, exec, dms ipc call spotlight toggle
bindd = SUPER, TAB, Toggle workspace overview, exec, dms ipc call hypr toggleOverview
bindd = SUPER, V, Toggle clipboard history, exec, dms ipc call clipboard toggle
bindd = SUPER, PERIOD, Toggle emoji picker, exec, dms ipc call emojiPicker toggle
bindd = SUPER, SLASH, Show keyboard shortcuts, exec, dms ipc call hypr toggleBinds
bindd = SUPER_SHIFT, Q, Open power menu, exec, dms ipc call powermenu toggle
bindd = SUPER, L, Lock session, exec, loginctl lock-session

# Applications and window layout
bindd = SUPER, RETURN, Open terminal, exec, alacritty
bindd = CTRL_ALT, T, Open terminal, exec, alacritty
bindd = SUPER, E, Open file manager, exec, dolphin
bindd = SUPER, Q, Close focused window, killactive,
bindd = SUPER, F, Toggle fullscreen, fullscreen,
bindd = SUPER_SHIFT, SPACE, Toggle floating, togglefloating,
bindd = SUPER, J, Toggle current split orientation, togglesplit,
bindd = SUPER_SHIFT, J, Swap windows in current split, swapsplit,

# Focus, move and resize
bindd = SUPER, LEFT, Focus window left, movefocus, l
bindd = SUPER, RIGHT, Focus window right, movefocus, r
bindd = SUPER, UP, Focus window up, movefocus, u
bindd = SUPER, DOWN, Focus window down, movefocus, d
bindd = SUPER_SHIFT, LEFT, Move window left, movewindow, l
bindd = SUPER_SHIFT, RIGHT, Move window right, movewindow, r
bindd = SUPER_SHIFT, UP, Move window up, movewindow, u
bindd = SUPER_SHIFT, DOWN, Move window down, movewindow, d
bindd = SUPER_CTRL, LEFT, Resize window left, resizeactive, -40 0
bindd = SUPER_CTRL, RIGHT, Resize window right, resizeactive, 40 0
bindd = SUPER_CTRL, UP, Resize window up, resizeactive, 0 40
bindd = SUPER_CTRL, DOWN, Resize window down, resizeactive, 0 -40
bindd = SUPER, mouse:272, Move window with mouse, movewindow,
bindd = SUPER, mouse:273, Resize window with mouse, resizewindow,

# Workspaces. Plain numpad input remains numeric; Super activates a workspace.
bindd = SUPER, KP_1, Switch to workspace 1, workspace, 1
bindd = SUPER, KP_2, Switch to workspace 2, workspace, 2
bindd = SUPER, KP_3, Switch to workspace 3, workspace, 3
bindd = SUPER, KP_4, Switch to workspace 4, workspace, 4
bindd = SUPER, KP_5, Switch to workspace 5, workspace, 5
bindd = SUPER, KP_6, Switch to workspace 6, workspace, 6
bindd = SUPER, KP_7, Switch to workspace 7, workspace, 7
bindd = SUPER, KP_8, Switch to workspace 8, workspace, 8
bindd = SUPER, KP_9, Switch to workspace 9, workspace, 9
bindd = SUPER, KP_0, Switch to workspace 10, workspace, 10
bindd = SUPER_SHIFT, KP_1, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER_SHIFT, KP_2, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER_SHIFT, KP_3, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER_SHIFT, KP_4, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER_SHIFT, KP_5, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER_SHIFT, KP_6, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER_SHIFT, KP_7, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER_SHIFT, KP_8, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER_SHIFT, KP_9, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER_SHIFT, KP_0, Move window to workspace 10, movetoworkspace, 10
bindd = CTRL_ALT, LEFT, Previous workspace on ultra-wide, exec, nixtop-workspace-cycle previous
bindd = CTRL_ALT, RIGHT, Next workspace on ultra-wide, exec, nixtop-workspace-cycle next
bindd = CTRL_ALT_SHIFT, LEFT, Move window to previous workspace, exec, nixtop-workspace-cycle previous move
bindd = CTRL_ALT_SHIFT, RIGHT, Move window to next workspace, exec, nixtop-workspace-cycle next move
bindd = SUPER, mouse_down, Next workspace, workspace, e+1
bindd = SUPER, mouse_up, Previous workspace, workspace, e-1

# Screen capture and media keys
bindd = , PRINT, Capture and annotate screenshot area, exec, /home/patrick/.config/hypr/quick-capture
bindd = , XF86AudioRaiseVolume, Increase volume, exec, dms ipc call audio increment 5
bindd = , XF86AudioLowerVolume, Decrease volume, exec, dms ipc call audio decrement 5
bindd = , XF86AudioMute, Toggle volume mute, exec, dms ipc call audio mute
bindd = , XF86AudioMicMute, Toggle microphone mute, exec, dms ipc call audio micmute
bindd = , XF86MonBrightnessUp, Increase brightness, exec, dms ipc call brightness increment 5
bindd = , XF86MonBrightnessDown, Decrease brightness, exec, dms ipc call brightness decrement 5
bindd = , XF86AudioNext, Next track, exec, dms ipc call mpris next
bindd = , XF86AudioPause, Play or pause, exec, dms ipc call mpris playPause
bindd = , XF86AudioPlay, Play or pause, exec, dms ipc call mpris playPause
bindd = , XF86AudioPrev, Previous track, exec, dms ipc call mpris previous
